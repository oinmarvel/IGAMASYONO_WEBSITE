<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E0A4"/>
      <stop offset="50%" stop-color="#E9C176"/>
      <stop offset="100%" stop-color="#C59B46"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5120D"/>
      <stop offset="100%" stop-color="#720401"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Flame & Ribs Center Motif -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- Fire Flame Outer -->
    <path d="M0,17 C-11,17 -18,8 -18,-2 C-18,-13 -7,-22 0,-29 C7,-22 18,-13 18,-2 C18,8 11,17 0,17 Z" fill="url(#goldGrad)"/>
    <!-- Fire Flame Inner -->
    <path d="M0,15 C-6,15 -11,8 -11,1 C-11,-6 -4,-12 0,-18 C4,-12 11,-6 11,1 C11,8 6,15 0,15 Z" fill="#800603"/>
    <!-- Ribs / Grill Bars Motif -->
    <path d="M-13,-2 Q0,4 13,-2" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M-11,4 Q0,10 11,4" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M-8,10 Q0,15 8,10" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Circular Text -->
  <text x="50" y="19" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1.8">WARUNG IGA</text>
  <text x="50" y="86" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1.5">MAS YONO</text>

  <!-- Star Accents -->
  <polygon points="21,47 22.5,50 25.5,50 23,51.8 24,54.8 21,53 18,54.8 19,51.8 16.5,50 19.5,50" fill="url(#goldGrad)"/>
  <polygon points="79,47 80.5,50 83.5,50 81,51.8 82,54.8 79,53 76,54.8 77,51.8 74.5,50 77.5,50" fill="url(#goldGrad)"/>
</svg>